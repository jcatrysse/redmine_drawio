  <text x="20" y="30" font-family="sans-serif" font-size="14">SVG with XSS vectors (e2e)</text>
  <foreignObject x="20" y="40" width="380" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font:13px sans-serif">HTML label kept</div>
    <iframe xmlns="http://www.w3.org/1999/xhtml" src="data:text/html,&lt;script&gt;alert('iframe')&lt;/script&gt;" width="10" height="10"></iframe>
