  <a id="tab-link" xlink:href="java&#x09;script:alert('tab-link')"><text x="20" y="100" fill="#0000ee">link with tab in scheme</text></a>
  <a id="anim-link"><animate attributeName="href" values="javascript:alert('animate')" begin="0s" fill="freeze"/><text x="220" y="100" fill="#0000ee">animated link</text></a>
